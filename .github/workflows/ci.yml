name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"
      - run: make setup
      - run: make lint
      - run: make test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load -t failsafe:dev .
      - run: docker run --rm --entrypoint python failsafe:dev -c "import failsafe, os; print(failsafe.__version__, os.getuid())"

  chaos:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"
      - run: make setup
      - name: compose chaos (kill containers under load, expect 0 client failures)
        run: DURATION=45 RPS=150 make chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-compose
          path: chaos/out/

  k8s-chaos:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: kubernetes chaos (kill pods under load, expect 0 client failures)
        run: DURATION=45 RPS=150 scripts/k8s-chaos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-k8s
          path: chaos/out/
