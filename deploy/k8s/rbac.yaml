apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: failsafe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-endpoints
  namespace: failsafe
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-endpoints
  namespace: failsafe
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: failsafe
roleRef:
  kind: Role
  name: gateway-endpoints
  apiGroup: rbac.authorization.k8s.io
