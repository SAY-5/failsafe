apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream
  namespace: failsafe
  labels: { app: upstream }
spec:
  replicas: 3
  selector:
    matchLabels: { app: upstream }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: upstream }
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: upstream
          image: failsafe:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "example_upstream", "--port", "9000"]
          ports:
            - { name: http, containerPort: 9000 }
          env:
            - name: UPSTREAM_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: upstream
  namespace: failsafe
  labels: { app: upstream }
spec:
  clusterIP: None   # headless: DNS returns one A record per ready pod
  publishNotReadyAddresses: false
  selector: { app: upstream }
  ports:
    - { name: http, port: 9000, targetPort: http }
