apiVersion: v1
kind: ConfigMap
metadata:
  name: failsafe-routes
  namespace: failsafe
data:
  routes.yaml: |
    health_check:
      interval_seconds: 1.0
      timeout_seconds: 0.5
      unhealthy_threshold: 1
      healthy_threshold: 1

    upstreams:
      orders:
        # Headless Service: every ready pod is an A record and becomes a replica.
        dns: upstream.failsafe.svc.cluster.local.
        port: 9000
        health_path: /health

    routes:
      - prefix: /orders
        upstream: orders
        timeout_seconds: 2.0
        connect_timeout_seconds: 0.5
        rate_limit:
          capacity: 200
          refill_per_second: 400
          key_header: X-API-Key
        retry:
          max_attempts: 4
          base_delay_ms: 10
          max_delay_ms: 150
          retry_on_status: [500, 502, 503, 504]
        breaker:
          window: 20
          failure_ratio: 0.5
          min_requests: 5
          consecutive_failures: 3
          open_seconds: 3.0
          half_open_max: 2
